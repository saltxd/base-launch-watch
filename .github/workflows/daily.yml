name: Report

on:
  schedule:
    # Every 4 hours. The free RPC serves about 5.5 hours of logs, so consecutive scans overlap
    # and history/ stitches them into a full day.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate REPORT.md
        env:
          # Optional. Leave unset to use the free public RPC. Set a repository secret named
          # BASE_RPC_URL to a node that serves older logs if a single scan should cover 24 hours.
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: node dist/cli.js --hours 24 --out REPORT.md --history history

      - name: Commit REPORT.md and history
        run: |
          git add REPORT.md history/
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Report $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
